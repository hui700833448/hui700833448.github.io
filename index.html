<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light only">
<title>启源传媒</title>

<style>
:root {
    --primary-bg: #1a1612;
    --text-main: #f5ead5;
    --text-sub: #a89880;
    --accent-color: #f0c75e;
    --gradient-start: #f0c75e;
    --gradient-end: #fff0c0;
    --shadow-dark: rgba(0, 0, 0, 0.5);
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --blur-strong: blur(16px) saturate(180%);
    --blur-medium: blur(12px) saturate(160%);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-highlight: rgba(255, 255, 255, 0.08);
    --icon-bg: rgba(35, 30, 25, 0.9);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    color-scheme: light only;
    -webkit-tap-highlight-color: transparent;
}

*:focus, *:focus-visible {
    outline: none !important;
    box-shadow: none !important;
}

button, a, input, .title-tab, .share-btn-nav {
    outline: none !important;
}

input:focus {
    outline: none !important;
    box-shadow: none !important;
    border-color: rgba(255,255,255,0.12) !important;
}

img {
    filter: none !important;
    -webkit-filter: none !important;
    background-color: #ffffff;
}

#bgCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
}

html, body {
    height: auto;
    overflow: hidden;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    color: var(--text-main);
    padding: 10px 8px 20px;
    background-color: transparent;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes popupIn {
    from { opacity: 0; transform: scale(0.92) translateY(12px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-24px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(24px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes logoFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-4px) scale(1.04); }
}

.anim-nav, .anim-marquee { opacity: 0; }

.play .anim-nav {
    animation: slideDown 0.55s cubic-bezier(0.32, 0.72, 0, 1) forwards;
}

.play .anim-marquee {
    animation: slideUp 0.55s cubic-bezier(0.32, 0.72, 0, 1) 0.15s forwards;
}

.content-card { opacity: 0; }

.content-card.in {
    animation: fadeInUp 0.45s cubic-bezier(0.32, 0.72, 0, 1) forwards;
}

.content-card.in:nth-child(1) { animation-delay: 0.00s; }
.content-card.in:nth-child(2) { animation-delay: 0.06s; }
.content-card.in:nth-child(3) { animation-delay: 0.12s; }
.content-card.in:nth-child(4) { animation-delay: 0.18s; }
.content-card.in:nth-child(5) { animation-delay: 0.24s; }
.content-card.in:nth-child(6) { animation-delay: 0.30s; }
.content-card.in:nth-child(7) { animation-delay: 0.36s; }
.content-card.in:nth-child(8) { animation-delay: 0.42s; }
.content-card.in:nth-child(9) { animation-delay: 0.48s; }
.content-card.in:nth-child(10) { animation-delay: 0.54s; }
.content-card.in:nth-child(11) { animation-delay: 0.60s; }
.content-card.in:nth-child(12) { animation-delay: 0.66s; }

.page-loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(26, 22, 18, 0.7);
    backdrop-filter: blur(40px) saturate(200%);
    -webkit-backdrop-filter: blur(40px) saturate(200%);
    z-index: 99999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 0.7s ease;
    gap: 20px;
}

.page-loader.hide {
    opacity: 0;
    pointer-events: none;
}

.loader-logo {
    width: 68px;
    height: 68px;
    border-radius: var(--radius-md);
    overflow: hidden;
    background: var(--icon-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1.5px 0 var(--glass-highlight);
    animation: logoFloat 2s ease-in-out infinite;
    border: 1.5px solid rgba(240, 199, 94, 0.4);
}

.loader-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.loader-logo .fallback-text {
    color: var(--accent-color);
    font-size: 24px;
    font-weight: 700;
}

.loader-progress-bar {
    width: 200px;
    height: 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 3px;
    overflow: hidden;
    border: 0.5px solid rgba(255, 255, 255, 0.06);
}

.loader-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
    border-radius: 3px;
    transition: width 0.3s ease;
    box-shadow: 0 0 8px rgba(240, 199, 94, 0.4);
}

.loader-text {
    color: var(--text-sub);
    font-size: 13px;
    letter-spacing: 0.5px;
    font-weight: 500;
}

.popup-mask {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.popup-mask.show { display: flex; }

.popup-mask.show .popup-content {
    animation: popupIn 0.5s cubic-bezier(0.32, 0.72, 0, 1) forwards;
}

.popup-content {
    background: rgba(45, 40, 35, 0.5);
    backdrop-filter: var(--blur-strong);
    -webkit-backdrop-filter: var(--blur-strong);
    border-radius: var(--radius-lg);
    padding: 28px 24px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 24px 64px var(--shadow-dark), inset 0 1.5px 0 var(--glass-highlight);
    border: 0.5px solid var(--glass-border);
    position: relative;
    opacity: 0;
}

.popup-close {
    position: absolute;
    top: 12px;
    right: 16px;
    background: rgba(255, 255, 255, 0.06);
    border: 0.5px solid rgba(255, 255, 255, 0.1);
    font-size: 20px;
    color: var(--text-sub);
    cursor: pointer;
    padding: 0;
    line-height: 1;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
}

.popup-close:active {
    transform: scale(0.9);
    background: rgba(255, 255, 255, 0.12);
}

.popup-title {
    font-size: 19px;
    color: var(--text-main);
    margin-bottom: 16px;
    text-align: center;
    font-weight: 700;
}

.popup-body p {
    font-size: 14px;
    color: var(--text-sub);
    margin-bottom: 10px;
    line-height: 1.6;
}

.popup-body strong {
    color: var(--accent-color);
}

.share-mask {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100001;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

.share-mask.show {
    opacity: 1;
    pointer-events: auto;
}

.share-sheet {
    background: rgba(45, 40, 35, 0.5);
    backdrop-filter: var(--blur-strong);
    -webkit-backdrop-filter: var(--blur-strong);
    border-radius: var(--radius-lg);
    padding: 28px 24px;
    width: 100%;
    max-width: 340px;
    border: 0.5px solid var(--glass-border);
    box-shadow: 0 24px 64px var(--shadow-dark), inset 0 1.5px 0 var(--glass-highlight);
    transform: scale(0.9) translateY(16px);
    opacity: 0;
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s ease;
}

.share-mask.show .share-sheet {
    transform: scale(1) translateY(0);
    opacity: 1;
}

.share-title {
    text-align: center;
    color: var(--text-main);
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 18px;
}

.share-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

.share-input {
    flex: 1;
    background: rgba(255, 255, 255, 0.08);
    border: 0.5px solid rgba(255, 255, 255, 0.12);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    color: var(--text-sub);
    font-size: 13px;
    outline: none;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
}

.btn-unified {
    background: rgba(255, 255, 255, 0.08);
    border: 0.5px solid rgba(255, 255, 255, 0.12);
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    color: var(--text-main);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s ease, transform 0.15s ease;
}

.btn-unified:active {
    transform: scale(0.96);
    background: rgba(255, 255, 255, 0.14);
}

/* ===== Toast 小弹窗（半透明） ===== */
.toast {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    padding: 9px 20px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 500;
    z-index: 999999;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
    white-space: nowrap;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.combined-header {
    position: relative;
    z-index: 1;
    background: transparent;
    backdrop-filter: var(--blur-strong);
    -webkit-backdrop-filter: var(--blur-strong);
    border: 0.5px solid var(--glass-border);
    border-radius: var(--radius-lg) var(--radius-lg) var(--radius-md) var(--radius-md);
    box-shadow: 0 8px 32px var(--shadow-dark), inset 0 1px 0 var(--glass-highlight);
    overflow: hidden;
}

.top-nav {
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.nav-logo-container {
    display: flex;
    align-items: center;
    gap: 10px;
}

.nav-logo {
    width: 44px;
    height: 44px;
    border-radius: 45%;
    overflow: hidden;
    background: var(--icon-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid rgba(240, 199, 94, 0.35);
}

.nav-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.nav-title h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent-color);
}

.share-btn-nav {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    border: 0.5px solid rgba(255, 255, 255, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.25s ease;
    padding: 0;
    flex-shrink: 0;
}

.share-btn-nav:active {
    transform: scale(0.88);
    background: rgba(255, 255, 255, 0.14);
}

.marquee-container {
    padding: 9px 0;
    overflow: hidden;
    white-space: nowrap;
    border-top: 0.5px solid var(--glass-border);
}

.marquee-content {
    display: inline-block;
    padding: 0 16px;
    color: var(--gradient-end);
    font-weight: 600;
    font-size: 13px;
    will-change: transform;
    transform: translateX(100vw);
}

.title-stack {
    position: relative;
    z-index: 1;
    margin: 8px 12px 0;
    perspective: 1200px;
}

.title-track {
    position: relative;
    height: 70px;
    touch-action: pan-y;
}

.title-tab {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    height: 52px;
    line-height: 52px;
    padding: 0 40px;
    border-radius: 26px;
    background: rgba(50, 45, 40, 0.45);
    backdrop-filter: var(--blur-strong);
    -webkit-backdrop-filter: var(--blur-strong);
    border: 0.5px solid var(--glass-border);
    box-shadow: 0 8px 28px var(--shadow-dark), inset 0 1px 0 var(--glass-highlight);
    font-size: 22px;
    font-weight: 700;
    color: var(--gradient-end);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    will-change: transform, opacity;
    transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.5s ease, filter 0.5s ease;
}

.title-tab.active {
    transform: translateX(-50%) scale(1);
    opacity: 1;
    filter: blur(0);
    z-index: 5;
    font-size: 24px;
}

.title-tab.left {
    transform: translateX(-112%) scale(0.82);
    opacity: 0.55;
    filter: blur(2px);
    z-index: 3;
}

.title-tab.right {
    transform: translateX(12%) scale(0.82);
    opacity: 0.55;
    filter: blur(2px);
    z-index: 3;
}

.title-tab.hidden {
    opacity: 0;
    transform: translateX(-50%) scale(0.7);
    pointer-events: none;
}

.content-panel {
    position: relative;
    z-index: 1;
    margin: 10px 12px 12px;
}

.panel-inner {
    opacity: 1;
    transform: translateY(0) scale(1);
    transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    will-change: opacity, transform;
}

.panel-inner.switching {
    opacity: 0;
    transform: translateY(6px) scale(0.99);
}

.content-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 12px;
}

.content-grid.single {
    grid-template-columns: 1fr;
}

.content-card {
    background: rgba(50, 45, 40, 0.7);
    backdrop-filter: var(--blur-medium);
    -webkit-backdrop-filter: var(--blur-medium);
    border-radius: var(--radius-md);
    overflow: hidden;
    padding: 12px 14px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.25s ease;
    border: none;
    box-shadow: 0 8px 24px var(--shadow-dark), inset 0 1px 0 var(--glass-highlight);
    display: flex;
    align-items: center;
    gap: 12px;
}

.content-card:active {
    transform: scale(0.98);
}

.card-icon {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-sm);
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 1px solid rgba(240, 199, 94, 0.3);
    flex-shrink: 0;
}

.card-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.card-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-desc {
    font-size: 12px;
    color: var(--text-sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.content-grid.single .card-info {
    flex-direction: row;
    align-items: baseline;
    gap: 8px;
}

@media (prefers-color-scheme: dark) {
    body { background-color: transparent !important; }
    .combined-header { background: transparent !important; }
    .title-tab { background: rgba(50, 45, 40, 0.45) !important; }
    .content-card { background: rgba(50, 45, 40, 0.7) !important; }
    .popup-content, .share-sheet { background: rgba(45, 40, 35, 0.5) !important; }
    img { filter: none !important; -webkit-filter: none !important; background-color: #ffffff !important; }
}
</style>
<noscript><style>.anim-nav,.anim-marquee{opacity:1!important;}</style></noscript>
</head>

const track = document.getElementById('titleTrack');
const panelInner = document.getElementById('panelInner');
let active = 1;

function renderPanel(idx) {
    const g = GROUPS[idx];
    const gridClass = g.single ? 'content-grid single' : 'content-grid';
    let html = `<div class="${gridClass}">`;
    g.items.forEach(it => {
        html += `<a href="${it.href}" class="content-card">
            <div class="card-icon"><img src="${it.img}" alt="${it.title}" onerror="this.style.display='none'"></div>
            <div class="card-info">
                <span class="card-title">${it.title}</span>
                <span class="card-desc">${it.desc}</span>
            </div>
        </a>`;
    });
    html += `</div>`;
    panelInner.innerHTML = html;
    requestAnimationFrame(() => {
        panelInner.querySelectorAll('.content-card').forEach(c => c.classList.add('in'));
    });
}

function update() {
    const tabs = track.querySelectorAll('.title-tab');
    tabs.forEach((t, i) => {
        t.classList.remove('active', 'left', 'right', 'hidden');
        if (i === active) t.classList.add('active');
        else if (i === active - 1) t.classList.add('left');
        else if (i === active + 1) t.classList.add('right');
        else t.classList.add('hidden');
    });
}

function go(i) {
    const newIdx = Math.max(0, Math.min(GROUPS.length - 1, i));
    if (newIdx === active) return;
    active = newIdx;
    update();
    panelInner.classList.add('switching');
    setTimeout(() => { renderPanel(active); panelInner.classList.remove('switching'); }, 200);
}

GROUPS.forEach((g, i) => {
    const tab = document.createElement('div');
    tab.className = 'title-tab';
    tab.textContent = g.title;
    tab.addEventListener('click', () => { go(i); });
    track.appendChild(tab);
});

renderPanel(active);
update();

let startX = null, startY = null, dx = 0, dy = 0;
track.addEventListener('touchstart', e => {
    const t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    dx = 0;
    dy = 0;
}, { passive: true });

track.addEventListener('touchmove', e => {
    if (startX == null) return;
    dx = e.touches[0].clientX - startX;
    dy = e.touches[0].clientY - startY;
}, { passive: true });

track.addEventListener('touchend', () => {
    if (startX == null) return;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0 && active < GROUPS.length - 1) go(active + 1);
        else if (dx > 0 && active > 0) go(active - 1);
    }
    startX = null;
    startY = null;
    dx = 0;
    dy = 0;
});

function showToast(msg) {
    var toast = document.getElementById('toast');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toast';
        toast.className = 'toast';
        document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function() {
        toast.classList.remove('show');
    }, 2000);
}

function copyText(text) {
    navigator.clipboard.writeText(text).then(function() {
        showToast('复制成功');
    }).catch(function() {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand('copy');
            showToast('复制成功');
        } catch(e) {
            showToast('复制失败');
        }
        document.body.removeChild(ta);
    });
}

window.addEventListener('DOMContentLoaded', function() {
    var images = document.querySelectorAll('img');
    var total = images.length, loaded = 0;
    var fill = document.getElementById('loaderFill'),
        text = document.getElementById('loaderText'),
        loader = document.getElementById('pageLoader');

    fill.style.width = '80%';
    text.textContent = '加载中 80%';

    function allLoaded() {
        fill.style.width = '100%';
        text.textContent = '加载中 100%';
        setTimeout(function() {
            loader.classList.add('hide');
            document.body.classList.add('play');
            setTimeout(function() { loader.style.display = 'none'; }, 700);
        }, 300);
        document.getElementById('welcomeMask').classList.add('show');
    }

    if (total === 0) { allLoaded(); return; }

    images.forEach(function(img) {
        var n = new Image();
        n.onload = n.onerror = function() {
            loaded++;
            var p = 80 + Math.round(loaded / total * 20);
            fill.style.width = p + '%';
            text.textContent = '加载中 ' + p + '%';
            if (loaded >= total) allLoaded();
        };
        n.src = img.src;
    });

    setTimeout(function() { if (loaded < total) allLoaded(); }, 8000);
});

(function() {
    var canvas = document.getElementById('bgCanvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    var W, H;

    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    var particles = [];
    var layers = [
        { count: 60,  minR: 2.4, maxR: 2.4, speed: 0.5, alpha: 0.7, color: [255, 225, 140] },
        { count: 100, minR: 1.6, maxR: 1.6, speed: 0.3, alpha: 0.5, color: [240, 199, 94] },
        { count: 140, minR: 0.9, maxR: 0.9, speed: 0.15, alpha: 0.3, color: [200, 160, 80] },
    ];

    layers.forEach(function(layer) {
        for (var i = 0; i < layer.count; i++) {
            particles.push({
                x: Math.random() * W,
                y: Math.random() * H,
                r: layer.minR,
                s: layer.speed * (0.5 + Math.random() * 1.5),
                a: Math.random() * Math.PI * 2,
                sa: (Math.random() - 0.5) * 0.008,
                layer: layer
            });
        }
    });

    function draw() {
        ctx.fillStyle = '#1a1612';
        ctx.fillRect(0, 0, W, H);

        var grad = ctx.createRadialGradient(W / 2, H, 0, W / 2, H, H * 0.65);
        grad.addColorStop(0, 'rgba(240, 199, 94, 0.15)');
        grad.addColorStop(1, 'rgba(26, 22, 18, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        for (var i = 0; i < particles.length; i++) {
            var p = particles[i];
            p.y -= p.s;
            p.a += p.sa;
            p.x += Math.sin(p.a) * 0.3;

            if (p.y < -p.r * 2) {
                p.y = H + p.r * 2;
                p.x = Math.random() * W;
            }
            if (p.x < -10) p.x = W + 10;
            if (p.x > W + 10) p.x = -10;

            var c = p.layer.color;
            var alpha = p.layer.alpha * (0.6 + 0.4 * Math.sin(p.a));
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + alpha + ')';
            ctx.fill();
        }
        requestAnimationFrame(draw);
    }
    draw();
})();
</script>
